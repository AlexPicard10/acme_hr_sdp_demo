# Databricks Asset Bundle — ACME HR 360 SDP demo
# Démo Data + Spark Declarative Pipelines (SDP / Lakeflow Declarative Pipelines) pour la montée en
# compétence des équipes HR Data sur Databricks (société fictive ACME).
#
#   Volumes UC (données brutes HR) ─► Auto Loader ─► SDP bronze→silver→gold ─► Materialized Views
#   La même logique est écrite deux fois : pipeline SQL (schéma acme_hr_sql) et pipeline Python
#   (schéma acme_hr_python). Gouverné par Unity Catalog, déployé par ce bundle.
#
# https://docs.databricks.com/dev-tools/bundles/index.html
bundle:
  name: acme_hr_sdp_demo

# NB : la synchro du bundle respecte déjà .gitignore (donc data/ est exclu automatiquement).
include:
  - resources/*.yml
  - resources/*/*.yml

variables:
  catalog:
    default: "alp_demo_catalog"
  # Schéma des données brutes et partagées : Volumes landing_fr / landing_be + référentiel departments.
  raw_schema:
    default: "acme_hr"
  # Un schéma cible par pipeline : mêmes noms de tables, deux langages.
  schema_sql:
    default: "acme_hr_sql"
  schema_python:
    default: "acme_hr_python"
  master_data_schema:
    default: "${var.catalog}.${var.raw_schema}"
  # Données brutes HR : un Volume Unity Catalog par filiale (le « bucket » de chaque SIRH),
  # un dossier par dataset. Chaque pipeline concatène les deux sources avec des Append Flows.
  employees_path_fr:
    default: "/Volumes/${var.catalog}/${var.raw_schema}/landing_fr/employees"
  employees_path_be:
    default: "/Volumes/${var.catalog}/${var.raw_schema}/landing_be/employees"
  absences_path_fr:
    default: "/Volumes/${var.catalog}/${var.raw_schema}/landing_fr/absences"
  absences_path_be:
    default: "/Volumes/${var.catalog}/${var.raw_schema}/landing_be/absences"
  dlt_development_mode:
    default: true

# Le host du workspace n'est PAS codé ici : déployé depuis l'UI (Git folder → panneau Deployments),
# le bundle cible le workspace courant. Adaptez `catalog` ci-dessus à votre workspace.
targets:
  # --- dev : itération locale + validation CI (pull requests) ---
  dev:
    mode: development
    default: true
    variables:
      dlt_development_mode: true

  # --- prod : déploiement CD (merge sur main) ---
  prod:
    mode: production
    variables:
      dlt_development_mode: false
